<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar palavra-passe - Conheça Farmácia</title>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#fafafa">
    <tr>
      <td align="center" style="padding:48px 20px">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:2px;overflow:hidden;border:1px solid #e8e8e8">

          <!-- HEADER -->
          <tr>
            <td style="padding:48px 40px 40px 40px;text-align:center;border-bottom:1px solid #f0f0f0">
              <img src="https://conhecafarmacia.com/logo/logo-principal-verde.png" alt="Conheça Farmácia" width="180" style="display:block;margin:0 auto 20px;height:auto" />
              <h1 style="margin:0 0 8px 0;font-size:26px;color:#1a1a1a;font-weight:700;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;letter-spacing:-0.5px">
                Recuperar palavra-passe
              </h1>
              <p style="margin:0;font-size:15px;color:#888888;line-height:1.6;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
                Recebemos um pedido para redefinir a tua palavra-passe.
              </p>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td style="padding:40px 40px">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:linear-gradient(135deg,#00493a 0%,#0a844f 100%);color:#ffffff;padding:16px 48px;text-decoration:none;border-radius:8px;font-size:15px;font-weight:600;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;letter-spacing:0.3px">
                      Criar Nova Palavra-passe
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:28px 0 0 0;font-size:13px;color:#999999;line-height:1.6;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;text-align:center">
                Se não pediste para alterar a palavra-passe, podes ignorar este email. A tua conta continua segura.
              </p>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="padding:24px 40px;border-top:1px solid #f0f0f0;text-align:center">
              <p style="margin:0;font-size:12px;color:#999999;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Conheça Farmácia &mdash; Conhecimento que conecta.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
